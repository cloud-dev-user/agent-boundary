# ---------------------------------------------------------------------------
# BOUNDARY 2 — the tool broker
#
# The agent has no direct route to any tool. Every call passes through here.
# The broker answers one question per call, against policy, and writes an
# audit record either way:
#
#     is THIS caller allowed THIS action on THIS resource?
#
# This is the difference between a policy document and a control. The
# document says "the agent may only read claims for the account it is
# working on". This enforces it, and proves what it enforced.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: tool-policy
  namespace: agent-boundary
data:
  policy.json: |
    {
      "version": 1,
      "principals": {
        "claims-agent": {
          "description": "Triage agent. Read-only, scoped to one account per session.",
          "allow": [
            {"tool": "claims.read",   "scope": "account"},
            {"tool": "claims.list",   "scope": "account"}
          ],
          "deny_reason_default": "not in allowlist for principal 'claims-agent'"
        }
      },
      "tools": {
        "claims.read":     {"upstream": "http://claims-api:8080/claims/{id}",  "method": "GET"},
        "claims.list":     {"upstream": "http://claims-api:8080/claims",       "method": "GET"},
        "payments.read":   {"upstream": "http://payments-api:8080/balance",    "method": "GET"},
        "payments.execute":{"upstream": "http://payments-api:8080/pay",        "method": "POST"}
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: broker-src
  namespace: agent-boundary
data:
  broker.py: |
    """Tool broker. Mediates every agent tool call against policy.

    Deny is the default. An unknown tool, an unknown principal or a call
    outside the session's scope is refused before any upstream request is
    made. Every decision is written to the audit stream.
    """
    import json, os, time, urllib.request, urllib.error
    from http.server import BaseHTTPRequestHandler, HTTPServer

    POLICY = json.load(open("/policy/policy.json"))
    AUDIT_PATH = os.environ.get("AUDIT_PATH", "/dev/stdout")

    def audit(**fields):
        rec = {"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), **fields}
        line = json.dumps(rec, sort_keys=True)
        print("AUDIT " + line, flush=True)
        try:
            with open(AUDIT_PATH, "a") as fh:
                fh.write(line + "\n")
        except OSError:
            pass

    def decide(principal, tool, args, session):
        """Return (allowed: bool, reason: str)."""
        p = POLICY["principals"].get(principal)
        if not p:
            return False, "unknown principal"
        if tool not in POLICY["tools"]:
            return False, "unknown tool"
        rule = next((r for r in p["allow"] if r["tool"] == tool), None)
        if not rule:
            return False, p.get("deny_reason_default", "not permitted")
        # Scope check: the agent may only touch the account it was given.
        if rule.get("scope") == "account":
            bound = session.get("account")
            asked = args.get("account")
            if bound and asked and asked != bound:
                return False, "out of scope: session bound to %s, call asked for %s" % (bound, asked)
        return True, "allowed by policy"

    def call_upstream(tool, args):
        spec = POLICY["tools"][tool]
        url = spec["upstream"].format(**{k: str(v) for k, v in args.items()})
        req = urllib.request.Request(url, method=spec["method"])
        with urllib.request.urlopen(req, timeout=5) as r:
            return json.loads(r.read().decode())

    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, {"ok": True})
            self._send(404, {"error": "no such route"})

        def do_POST(self):
            if self.path != "/invoke":
                return self._send(404, {"error": "no such route"})
            n = int(self.headers.get("Content-Length", 0))
            try:
                body = json.loads(self.rfile.read(n) or b"{}")
            except ValueError:
                return self._send(400, {"error": "invalid json"})

            principal = self.headers.get("X-Agent-Identity", "anonymous")
            tool = body.get("tool", "")
            args = body.get("args", {}) or {}
            session = body.get("session", {}) or {}

            allowed, reason = decide(principal, tool, args, session)
            if not allowed:
                audit(decision="DENY", principal=principal, tool=tool,
                      args=args, session=session, reason=reason)
                return self._send(403, {"decision": "DENY", "tool": tool, "reason": reason})

            try:
                result = call_upstream(tool, args)
            except urllib.error.HTTPError as e:
                audit(decision="ALLOW", principal=principal, tool=tool, args=args,
                      upstream_status=e.code, reason=reason)
                return self._send(e.code, {"decision": "ALLOW", "tool": tool,
                                           "error": "upstream %s" % e.code})
            except Exception as e:
                audit(decision="ALLOW", principal=principal, tool=tool, args=args,
                      upstream_error=str(e), reason=reason)
                return self._send(502, {"decision": "ALLOW", "tool": tool,
                                        "error": "upstream unreachable: %s" % e})

            audit(decision="ALLOW", principal=principal, tool=tool, args=args,
                  session=session, reason=reason)
            self._send(200, {"decision": "ALLOW", "tool": tool, "result": result})

        def log_message(self, fmt, *args):
            pass  # the audit stream is the log that matters

    print("tool-broker listening on :8081", flush=True)
    HTTPServer(("0.0.0.0", 8081), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-broker
  namespace: agent-boundary
spec:
  replicas: 1
  selector:
    matchLabels: {app: tool-broker}
  template:
    metadata:
      labels: {app: tool-broker, tier: control-plane}
    spec:
      serviceAccountName: tool-broker
      automountServiceAccountToken: false
      containers:
        - name: broker
          image: python:3.12-alpine
          command: ["python", "-u", "/src/broker.py"]
          ports: [{containerPort: 8081}]
          env:
            - name: AUDIT_PATH
              value: /audit/decisions.jsonl
          volumeMounts:
            - {name: src, mountPath: /src}
            - {name: policy, mountPath: /policy}
            - {name: audit, mountPath: /audit}
          readinessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 3
      volumes:
        - name: src
          configMap: {name: broker-src}
        - name: policy
          configMap: {name: tool-policy}
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tool-broker
  namespace: agent-boundary
spec:
  selector: {app: tool-broker}
  ports: [{port: 8081, targetPort: 8081}]
