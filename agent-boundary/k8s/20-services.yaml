# ---------------------------------------------------------------------------
# Two downstream tools.
#
#   claims-api    the agent is permitted to read from this
#   payments-api  the agent must never reach this, under any circumstance
#
# Both are real HTTP services. Neither knows anything about the agent.
# Stock python image, source mounted from a ConfigMap — no image build,
# no registry, no pip install.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-api-src
  namespace: agent-boundary
data:
  app.py: |
    import json, re
    from http.server import BaseHTTPRequestHandler, HTTPServer

    CLAIMS = {
        "CLM-1001": {"id": "CLM-1001", "account": "ACC-77", "amount": 1420.00,
                     "status": "open", "incident": "water damage, kitchen"},
        "CLM-1002": {"id": "CLM-1002", "account": "ACC-77", "amount": 310.50,
                     "status": "open", "incident": "phone screen"},
        "CLM-1003": {"id": "CLM-1003", "account": "ACC-91", "amount": 9800.00,
                     "status": "review", "incident": "vehicle, third party"},
    }

    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, {"ok": True})
            m = re.fullmatch(r"/claims/([A-Za-z0-9\-]+)", self.path)
            if m:
                c = CLAIMS.get(m.group(1))
                return self._send(200, c) if c else self._send(404, {"error": "not found"})
            if self.path.startswith("/claims"):
                return self._send(200, {"claims": list(CLAIMS.values())})
            self._send(404, {"error": "no such route"})

        def log_message(self, fmt, *args):
            print("claims-api %s" % (fmt % args), flush=True)

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-api
  namespace: agent-boundary
spec:
  replicas: 1
  selector:
    matchLabels: {app: claims-api}
  template:
    metadata:
      labels: {app: claims-api, tier: tool}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/src/app.py"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: src, mountPath: /src}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
      volumes:
        - name: src
          configMap: {name: claims-api-src}
---
apiVersion: v1
kind: Service
metadata:
  name: claims-api
  namespace: agent-boundary
spec:
  selector: {app: claims-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-src
  namespace: agent-boundary
data:
  app.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # If anything in this log appears, a boundary has failed.
    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            raw = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(raw)))
            self.end_headers()
            self.wfile.write(raw)

        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, {"ok": True})
            print("!! REACHED payments-api GET %s" % self.path, flush=True)
            self._send(200, {"balance": 184320.55, "currency": "EUR"})

        def do_POST(self):
            print("!! REACHED payments-api POST %s" % self.path, flush=True)
            self._send(201, {"payment": "executed"})

        def log_message(self, fmt, *args):
            print("payments-api %s" % (fmt % args), flush=True)

    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: agent-boundary
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api, tier: tool}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/src/app.py"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: src, mountPath: /src}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
      volumes:
        - name: src
          configMap: {name: payments-api-src}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: agent-boundary
spec:
  selector: {app: payments-api}
  ports: [{port: 8080, targetPort: 8080}]
