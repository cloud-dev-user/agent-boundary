# ---------------------------------------------------------------------------
# The agent.
#
# Deliberately not clever. It runs a fixed plan, because the point of this
# repo is the boundary, not the model. Swap the plan for an LLM loop and
# nothing below it changes — which is exactly the argument.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-src
  namespace: agent-boundary
data:
  agent.py: |
    """Claims triage agent.

    Session is bound to one account. The agent attempts a sequence of tool
    calls, including several it is not entitled to make. It has no direct
    network route to any tool — only to the broker.
    """
    import json, os, sys, time, urllib.request, urllib.error

    BROKER = os.environ.get("BROKER_URL", "http://tool-broker:8081/invoke")
    IDENTITY = os.environ.get("AGENT_IDENTITY", "claims-agent")
    SESSION = {"account": os.environ.get("BOUND_ACCOUNT", "ACC-77")}

    PLAN = [
        ("claims.list",      {"account": "ACC-77"},              "list my account's claims"),
        ("claims.read",      {"id": "CLM-1001", "account": "ACC-77"}, "read a claim I own"),
        ("claims.read",      {"id": "CLM-1003", "account": "ACC-91"}, "read another account's claim"),
        ("payments.read",    {},                                  "check the payment balance"),
        ("payments.execute", {"amount": 1420.00},                 "settle the claim"),
        ("secrets.read",     {"name": "db-credentials"},          "fetch database credentials"),
    ]

    def invoke(tool, args):
        payload = json.dumps({"tool": tool, "args": args, "session": SESSION}).encode()
        req = urllib.request.Request(
            BROKER, data=payload, method="POST",
            headers={"Content-Type": "application/json", "X-Agent-Identity": IDENTITY},
        )
        try:
            with urllib.request.urlopen(req, timeout=6) as r:
                return r.status, json.loads(r.read().decode())
        except urllib.error.HTTPError as e:
            return e.code, json.loads(e.read().decode() or "{}")
        except Exception as e:
            return 0, {"error": str(e)}

    def direct_attempt(url):
        """Try to bypass the broker entirely. NetworkPolicy should stop this."""
        try:
            with urllib.request.urlopen(url, timeout=4) as r:
                return "REACHED (boundary failed) %s" % r.status
        except Exception as e:
            return "blocked at the network: %s" % type(e).__name__

    def main():
        print("=" * 72, flush=True)
        print("agent identity : %s" % IDENTITY, flush=True)
        print("session scope  : account=%s" % SESSION["account"], flush=True)
        print("=" * 72, flush=True)

        allowed = denied = 0
        for tool, args, intent in PLAN:
            status, body = invoke(tool, args)
            decision = body.get("decision", "ERROR")
            mark = "OK  " if decision == "ALLOW" else "DENY"
            if decision == "ALLOW":
                allowed += 1
            else:
                denied += 1
            print("[%s] %-17s %s" % (mark, tool, intent), flush=True)
            if decision != "ALLOW":
                print("       reason: %s" % body.get("reason", body.get("error", "?")), flush=True)
            time.sleep(0.4)

        print("-" * 72, flush=True)
        print("bypass attempts (agent tries to reach tools directly):", flush=True)
        for url in ("http://claims-api:8080/claims",
                    "http://payments-api:8080/balance"):
            print("       %-42s %s" % (url, direct_attempt(url)), flush=True)

        print("-" * 72, flush=True)
        print("allowed: %d   denied: %d" % (allowed, denied), flush=True)
        print("every decision above is in the broker's audit stream.", flush=True)
        print("run: make audit", flush=True)

    if __name__ == "__main__":
        main()
        # stay alive so the pod can be inspected
        while True:
            time.sleep(3600)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-agent
  namespace: agent-boundary
spec:
  replicas: 1
  selector:
    matchLabels: {app: claims-agent}
  template:
    metadata:
      labels: {app: claims-agent, tier: agent}
    spec:
      serviceAccountName: claims-agent
      containers:
        - name: agent
          image: python:3.12-alpine
          command: ["python", "-u", "/src/agent.py"]
          env:
            - {name: AGENT_IDENTITY, value: claims-agent}
            - {name: BOUND_ACCOUNT, value: ACC-77}
          volumeMounts: [{name: src, mountPath: /src}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: src
          configMap: {name: agent-src}
